    h=h.replace(/<script\s+type=["']module["']/i, mapTag+'<script type="module"');

    // Add visible edition label without altering official layout structure.
    const badge=`<style>
      #ykl-mod-edition{position:fixed;left:8px;bottom:8px;z-index:2147483000;
        padding:5px 8px;border-radius:999px;background:#0f2d1ddd;border:1px solid #477b58;
        color:#b9ffc9;font:700 10px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
        pointer-events:none;opacity:.72}
    </style><div id="ykl-mod-edition">YaKyoLife v1.5.1 · MOD v1.0</div>`;

    // Decode and run our existing v0.9.2 feature set after official DOM is present.
    const inject=`<script>
      (function(){
        const bytes=Uint8Array.from(atob('${MOD_B64}'),c=>c.charCodeAt(0));
        const code=new TextDecoder().decode(bytes);
        const s=document.createElement('script');
        s.textContent=code;
        document.documentElement.appendChild(s);
      })();
    <\\/script>`;

    h=h.replace(/<\/body>/i,badge+inject+'</body>');

    document.open();
    document.write(h);
    document.close();

    console.error('[YaKyoLife MOD loader]',e);
    const el=document.getElementById('ykl-err');
    if(el)el.textContent='啟動失敗：'+e.message+'。請確認網路後重新整理。';
  }
})();
</script>
